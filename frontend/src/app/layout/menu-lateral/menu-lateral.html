<!-- Fundo escuro por trás do menu (só no telemóvel): carregar nele fecha o menu -->
@if (aberto) {
  <button type="button" class="menu-fundo" aria-label="Fechar menu" (click)="fechar.emit()"></button>
}

<nav id="menu-lateral" class="menu" [class.aberto]="aberto" aria-label="Menu principal">
  <div class="menu-topo">
    <a routerLink="/" class="logo" (click)="fechar.emit()">
      <span class="logo-marca"></span>
      REPLOG
    </a>
    <button type="button" class="botao-icone menu-fechar" aria-label="Fechar menu" (click)="fechar.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>

  @if (treinoEmCurso(); as treino) {
    <a
      class="em-curso"
      [routerLink]="['/treino', treino.fichaId]"
      routerLinkActive="ativo"
      ariaCurrentWhenActive="page"
      (click)="fechar.emit()"
    >
      <span class="em-curso-ponto" aria-hidden="true"></span>
      <span class="em-curso-texto">
        <span class="em-curso-rotulo">Treino a decorrer</span>
        <strong>{{ treino.nomeFicha }}</strong>
      </span>
    </a>
  }

  <ul class="menu-lista">
    @for (item of itens; track item.rota) {
      <li>
        <a
          class="menu-item"
          [routerLink]="item.rota"
          routerLinkActive="ativo"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.exato }"
          (click)="fechar.emit()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="item.icone" />
          </svg>
          {{ item.rotulo }}
        </a>
      </li>
    }
  </ul>

  <!-- A conta: quem entrou, mudar a palavra-passe e sair -->
  <div class="menu-conta">
    <p class="menu-email texto-secundario" [title]="email()">{{ email() }}</p>
    <a class="menu-ligacao" routerLink="/nova-palavra-passe" (click)="fechar.emit()">Mudar a palavra-passe</a>
    <button type="button" class="botao menu-sair" [disabled]="aSair()" (click)="sair()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3" />
      </svg>
      {{ aSair() ? 'A sair…' : 'Sair' }}
    </button>
  </div>
</nav>
