<header class="cabecalho">
  <button
    type="button"
    class="botao-icone cabecalho-menu"
    aria-label="Abrir menu"
    aria-controls="menu-lateral"
    [attr.aria-expanded]="menuAberto"
    (click)="abrirMenu.emit()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" />
    </svg>
  </button>

  <a routerLink="/" class="logo cabecalho-logo">
    <span class="logo-marca"></span>
    REPLOG
  </a>

  <button
    type="button"
    class="botao-icone"
    [attr.aria-label]="temaService.tema() === 'escuro' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'"
    (click)="temaService.alternar()"
  >
    @if (temaService.tema() === 'escuro') {
      <!-- sol: carregar passa para o tema claro -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    } @else {
      <!-- lua: carregar passa para o tema escuro -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      </svg>
    }
  </button>
</header>
