<h1 class="pagina-titulo">Exercícios</h1>

<!-- filho -> pai: a lista avisa quando se carrega no + de um exercício -->
<app-lista-exercicios (escolher)="abrirPainel($event)" />

<!-- Painel para escolher a ficha onde entra o exercício -->
@if (escolhido(); as exercicio) {
  <button type="button" class="painel-fundo" aria-label="Fechar" (click)="fecharPainel()"></button>
  <section class="painel" appPainel role="dialog" aria-modal="true" aria-labelledby="titulo-painel">
    <h2 id="titulo-painel">Adicionar à ficha</h2>
    <p class="texto-secundario">{{ exercicio.nome }}</p>

    @for (ficha of fichas(); track ficha.id) {
      <button type="button" class="botao opcao-ficha" (click)="adicionarAFicha(ficha, exercicio)">
        <span>{{ ficha.nome }}</span>
        <span class="texto-secundario">{{ ficha.exercicios.length | i18nPlural: plural }}</span>
      </button>
    } @empty {
      <p>Ainda não tens fichas de treino.</p>
      <a routerLink="/fichas/nova" class="botao botao-principal">Criar uma ficha</a>
    }

    <button type="button" class="botao" (click)="fecharPainel()">Cancelar</button>
  </section>
}

@if (aviso()) {
  <p class="aviso" role="status">{{ aviso() }}</p>
}
