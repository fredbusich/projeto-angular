<article class="exercicio">
  @if (exercicio.imagem) {
    <!-- alt vazio: a imagem é decorativa, o nome já está escrito ao lado -->
    <img class="exercicio-imagem" [src]="exercicio.imagem" alt="" loading="lazy" width="64" height="64" />
  } @else {
    <span class="exercicio-imagem sem-imagem" aria-hidden="true">{{ sigla }}</span>
  }

  <div class="exercicio-info">
    <h3 class="exercicio-nome">{{ exercicio.nome }}</h3>
    <p class="exercicio-detalhe">{{ detalhe }}</p>
  </div>

  <button
    type="button"
    class="botao-icone"
    [attr.aria-label]="'Adicionar ' + exercicio.nome + ' a uma ficha'"
    (click)="adicionar.emit(exercicio)"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>
</article>
