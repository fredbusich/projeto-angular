<div class="serie" [class.feita]="serie.feita" [class.atual]="atual">
  <span class="numero">
    {{ serie.numero }}
    @if (recorde) {
      <svg class="trofeu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4" /></svg>
      <span class="sr-only">novo recorde</span>
    }
  </span>

  <span class="anterior">
    @if (anterior) {
      {{ anterior.carga | number: '1.0-2' }} × {{ anterior.repeticoes }}
    } @else {
      —
    }
  </span>

  <input
    class="campo-serie"
    type="text"
    inputmode="decimal"
    placeholder="0"
    [value]="cargaTexto"
    [attr.aria-label]="'Carga da série ' + serie.numero + ' em kg'"
    (change)="mudarCarga($event)"
  />
  <input
    class="campo-serie"
    type="text"
    inputmode="numeric"
    [value]="serie.repeticoes"
    [attr.aria-label]="'Repetições da série ' + serie.numero"
    (change)="mudarRepeticoes($event)"
  />

  <button
    type="button"
    class="marcar"
    [attr.aria-pressed]="serie.feita"
    [attr.aria-label]="'Série ' + serie.numero + ' feita'"
    (click)="alternarFeita.emit()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12l5 5 9-10" />
    </svg>
  </button>
</div>
