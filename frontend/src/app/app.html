@if (autenticado()) {
  <div class="app">
    <app-menu-lateral [aberto]="menuAberto()" (fechar)="fecharMenu()" />

    <div class="app-conteudo">
      <app-cabecalho [menuAberto]="menuAberto()" (abrirMenu)="abrirMenu()" />

      <main class="pagina">
        <!-- Aqui aparece a página da rota ativa (Início, Fichas, Histórico…) -->
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <!-- Sem sessão: só entrar, criar conta e recuperar a palavra-passe (cada uma com o seu cartão) -->
  <main>
    <router-outlet />
  </main>
}
