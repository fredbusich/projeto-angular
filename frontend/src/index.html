<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>RepLog — Diário de Treinos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Planeia as tuas fichas de treino e regista cada série no ginásio.">
  <meta name="theme-color" content="#0B0B0C">

  <!-- Ícones e "Adicionar ao ecrã principal" (abre em ecrã inteiro, como uma app) -->
  <link rel="icon" type="image/svg+xml" href="icone.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RepLog">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">

  <!-- Aplica o tema guardado antes de o Angular arrancar, para a página não "piscar" a escuro -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem('replog-tema')) === 'claro') {
        document.documentElement.dataset.tema = 'claro';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F2F2EF');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
